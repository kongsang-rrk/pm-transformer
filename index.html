<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--bg4:#21262d;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);--text:#e6edf3;--text2:#c9d1d9;--text3:#8b949e;--accent:#58a6ff;--accent2:#1f6feb;--green:#3fb950;--amber:#d29922;--red:#f85149;--purple:#bc8cff;--font:'IBM Plex Sans Thai',sans-serif;--mono:'IBM Plex Mono',monospace;--r:8px;--rl:10px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.app{display:flex;height:100vh;overflow:hidden}
/* Sidebar */
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-logo{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:var(--amber);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;font-size:13px;flex-shrink:0}
.logo-text{overflow:hidden}.logo-t1{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.logo-t2{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-s{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:12px 16px 4px}
.nav-i{display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;border-radius:6px;margin:0 8px;font-size:13px;color:var(--text2);transition:all .15s}
.nav-i:hover{background:var(--bg3);color:var(--text)}
.nav-i.active{background:rgba(88,166,255,.12);color:var(--accent);font-weight:500}
.nav-ic{width:18px;text-align:center;font-size:14px;flex-shrink:0}
.sidebar-user{padding:12px 16px;border-top:1px solid var(--border);margin-top:auto;display:flex;align-items:center;gap:8px}
.u-av{width:30px;height:30px;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#000;flex-shrink:0}
/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.breadcrumb{flex:1;font-size:13px;color:var(--text3)}.breadcrumb b{color:var(--text)}
.content{flex:1;overflow-y:auto;padding:20px}
/* Cards */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:18px;margin-bottom:14px}
.card-t,.st{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
/* Form */
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fl{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.fi{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:8px 10px;color:var(--text);font-family:var(--font);font-size:13px;width:100%;transition:border-color .15s;outline:none}
.fi:focus{border-color:var(--accent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-family:var(--font);font-size:13px;cursor:pointer;transition:all .15s;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-p{background:var(--accent2);border-color:var(--accent2);color:#fff}.btn-p:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-s{background:rgba(63,185,80,.15);border-color:rgba(63,185,80,.3);color:var(--green)}.btn-s:hover{background:rgba(63,185,80,.25)}
.btn-d{background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.25);color:var(--red)}.btn-d:hover{background:rgba(248,81,73,.22)}
.btn-sm{padding:4px 10px;font-size:12px}
/* Inspection checkbox buttons */
.chk-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.chk-label{flex:1;font-size:13px}
.chk-sub{font-size:11px;color:var(--text3)}
.chk-btns{display:flex;gap:6px;flex-shrink:0}
.cb{padding:4px 12px;border-radius:14px;border:1px solid var(--border2);background:var(--bg3);color:var(--text3);font-size:12px;cursor:pointer;transition:all .15s;font-family:var(--font)}
.cb:hover{border-color:var(--accent);color:var(--accent)}
.cb.ok{background:rgba(63,185,80,.15);border-color:rgba(63,185,80,.3);color:var(--green);font-weight:600}
.cb.ng{background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.25);color:var(--red);font-weight:600}
.cb.na{background:rgba(139,148,158,.1);border-color:var(--border);color:var(--text3);font-weight:600}
.sec-title{font-size:11px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.08em;padding:10px 0 6px;border-bottom:1px solid var(--border);margin-bottom:4px}
/* Input fields */
.vi{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:5px 8px;color:var(--text);font-family:var(--mono);font-size:12px;width:90px;text-align:center;outline:none}
.vi:focus{border-color:var(--accent)}
/* Table */
.cht{width:100%;border-collapse:collapse;font-size:13px}
.cht th{padding:8px 10px;background:var(--bg3);font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);text-align:left}
.cht td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.cht tr:hover td{background:rgba(255,255,255,.02)}
/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;border:1px solid}
.b-ok{background:rgba(63,185,80,.1);color:var(--green);border-color:rgba(63,185,80,.25)}
.b-ng{background:rgba(248,81,73,.1);color:var(--red);border-color:rgba(248,81,73,.25)}
.b-na{background:rgba(139,148,158,.1);color:var(--text3);border-color:var(--border)}
.b-al{background:rgba(210,153,34,.12);color:var(--amber);border-color:rgba(210,153,34,.25)}
/* Modal */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:20px}
.mo.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;width:700px;max-width:100%;max-height:90vh;display:flex;flex-direction:column}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.mb{padding:20px;overflow-y:auto;flex:1}
.mc-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:4px;line-height:1}
/* Login */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:32px;width:360px}
.login-logo{width:52px;height:52px;background:var(--amber);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#000;margin:0 auto 16px}
/* Toast */
.toast-c{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;background:var(--bg2);border:1px solid var(--border);color:var(--text);animation:fadeIn .2s ease;pointer-events:auto}
.toast.ok{border-color:rgba(63,185,80,.4);color:var(--green)}
.toast.err{border-color:rgba(248,81,73,.4);color:var(--red)}
.toast.warn{border-color:rgba(210,153,34,.4);color:var(--amber)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* Tabs */
.itab{display:flex;gap:4px;margin-bottom:16px;background:var(--bg3);border-radius:8px;padding:4px}
.it{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text3);transition:all .15s}
.it:hover{color:var(--text)}
.it.active{background:var(--bg2);color:var(--text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.3)}
/* Print */
@media print{
  .sidebar,.topbar,.toast-c,.btn,.chk-btns .cb:not(.ok):not(.ng):not(.na){display:none!important}
  .content{padding:0!important;overflow:visible!important}
  .app{display:block!important;height:auto!important}
  .main{overflow:visible!important}
  .card{break-inside:avoid;border:1px solid #ccc!important;background:#fff!important}
  body{background:#fff!important;color:#000!important}
  *{color:#000!important}
}
/* Role */
.role-chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;font-size:9px;font-weight:600}
.role-admin{background:rgba(248,81,73,.15);color:var(--red);border:1px solid rgba(248,81,73,.25)}
.role-editor{background:rgba(63,185,80,.12);color:var(--green);border:1px solid rgba(63,185,80,.25)}
.role-viewer{background:rgba(139,148,158,.12);color:var(--text3);border:1px solid var(--border)}
</style>
</head>
<body>
<div class="toast-c" id="toasts"></div>

<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">⚡</div>
    <h2 style="text-align:center;margin-bottom:4px;font-size:18px">PM Transformer</h2>
    <p style="text-align:center;color:var(--text3);font-size:13px;margin-bottom:24px">GPSC — Glow Energy Phase 2</p>
    <div class="fg"><label class="fl">Email</label><input class="fi" id="lg-em" type="email" placeholder="user@email.com"></div>

    <button class="btn btn-p" style="width:100%;margin-top:12px;justify-content:center" onclick="doLogin()">เข้าสู่ระบบ</button>

  </div>
</div>

<!-- App -->
<div class="app" id="main-app" style="display:none">
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon" id="sli-el">TR</div>

    <div class="nav-s">Master Data</div>
    <div class="nav-i" id="nav-equipment" onclick="go('equipment',this)"><span class="nav-ic">⊞</span> Transformer</div>
    <div class="nav-i" id="nav-import" onclick="go('import',this)"><span class="nav-ic">📥</span> Import Excel</div>
    <div class="nav-i" id="nav-settings" onclick="go('settings',this)"><span class="nav-ic">⚙</span> Settings</div>
    <div class="sidebar-user">
      <div class="u-av" id="uav">?</div>
      <div style="flex:1;overflow:hidden">
        <div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="uname">—</div>
        <div style="font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="uemail">—</div>
      </div>

  </div>
  <div class="main">

      <div class="breadcrumb"><b id="ptitle">Dashboard</b></div>
      <div id="tclock" style="font-size:12px;color:var(--text3);font-family:var(--mono)"></div>
      <button class="btn btn-p btn-sm" id="btn-newpm" onclick="go('checksheet',E('nav-checksheet'))">+ New PM</button>
      <button class="btn btn-d btn-sm" onclick="doLogout()">Logout</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const E=id=>document.getElementById(id);
let S={eq:[],rec:[],set:{plant:'GEN2',co:'GPSC'},role:'viewer',usr:null};

// ── Auth ──
async function doLogin(){const e=E('lg-em').value,p=E('lg-pw').value;try{await auth.signInWithEmailAndPassword(e,p);}catch(err){E('lg-err').textContent=err.message;}}
async function doLogout(){await auth.signOut();}
auth.onAuthStateChanged(async u=>{
  if(u){
    S.usr=u;
    E('login-screen').style.display='none';
    E('main-app').style.display='flex';
    E('uav').textContent=u.email.slice(0,2).toUpperCase();
    E('uname').textContent=u.displayName||u.email.split('@')[0];
    E('uemail').textContent=u.email;
    await loadRole(u);
    await loadAll();
    go('dashboard',E('nav-dashboard'));
  }else{E('login-screen').style.display='flex';E('main-app').style.display='none';}
});

async function loadRole(u){
  try{
    const doc=await db.collection('users').doc(u.email).get();
    if(doc.exists){S.role=doc.data().role||'viewer';}
    else{
      const all=await db.collection('users').limit(1).get();
      S.role=all.empty?'admin':'viewer';
      await db.collection('users').doc(u.email).set({email:u.email,role:S.role,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    }
    const rb=E('role-badge');
    if(rb){rb.textContent=S.role==='admin'?'Admin':S.role==='editor'?'Editor':'Viewer';rb.className='role-chip '+(S.role==='admin'?'role-admin':S.role==='editor'?'role-editor':'role-viewer');}
    if(E('btn-newpm'))E('btn-newpm').style.display=canEdit()?'':'none';
  }catch(e){S.role='viewer';}
}
const isAdmin=()=>S.role==='admin';
const canEdit=()=>S.role==='admin'||S.role==='editor';

async function loadAll(){
  try{
    const [es,rs,ss]=await Promise.all([
      db.collection('tr_equipment').get(),
      db.collection('tr_records').orderBy('date','desc').get(),
      db.collection('settings').doc('global').get()
    ]);
    S.eq=es.docs.map(d=>({id:d.id,...d.data()}));
    S.rec=rs.docs.map(d=>({id:d.id,...d.data()}));
    if(ss.exists)S.set={...S.set,...ss.data()};
  }catch(e){toast('Load error: '+e.message,'err');}
}

// ── Navigation ──
function go(p,nav){
  document.querySelectorAll('.nav-i').forEach(x=>x.classList.remove('active'));
  if(nav)nav.classList.add('active');
  E('ptitle').textContent={dashboard:'Dashboard',checksheet:'PM Check Sheet',history:'PM History',equipment:'Transformer List',settings:'Settings',import:'Import Excel'}[p]||p;
  const c=E('content');c.innerHTML='';
  ({dashboard:pgDash,checksheet:pgCheck,history:pgHist,equipment:pgEq,settings:pgSet,import:pgImport})[p]?.(c);
}

// ── Toast ──
function toast(msg,type='ok'){
  const t=document.createElement('div');t.className='toast '+(type==='err'?'err':type==='warn'?'warn':'ok');
  t.textContent=msg;E('toasts').appendChild(t);setTimeout(()=>t.remove(),3000);
}

// ── Clock ──
function uClock(){if(E('tclock')){const n=new Date();E('tclock').textContent=n.toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'})+' '+n.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});}}
setInterval(uClock,1000);uClock();

// ── Inspection check items ──
const GEN_ITEMS=[
  {sec:'MAIN TANK',items:[
    {k:'oil_leak',label:'No Oil Leakage'},
    {k:'terminal',label:'Connector Terminal and bushing are good condition',sub:'[Shut down condition]'},
    {k:'tighten',label:'Tighten Terminal and mark check',sub:'[Shut down condition]'},
    {k:'tap_chg',label:'OFF-Load Tap change Position'},
    {k:'sound',label:'No abnormal Sound / Vibration'},
    {k:'heater_tank',label:'Heater operating normally [150W]'},
  ]},
  {sec:'BREATHER',items:[
    {k:'silica',label:'Color of silica gel *',sub:'<80% Orange'},

  ]},

  ]},
  {sec:'BUCHHOLZ RELAY',items:[
    {k:'valve_open',label:'Valve open position'},
    {k:'buchholz_leak',label:'No Oil Leaks'},
    {k:'no_gas',label:'No Gas detect'},
  ]},
  {sec:'PRESSURE RELIEF',items:[
    {k:'pr_blowout',label:'Marks of blowout in service'},

  {sec:'RAPID PRESSURE RELIEF',items:[
    {k:'rpr_leak',label:'No Oil Leaks'},
  ]},
  {sec:'LOCAL PANEL',items:[
    {k:'led_ok',label:'LED Status working normally'},
    {k:'no_alarm',label:'No Alarm active'},
    {k:'heater_panel',label:'Heater operating normally [150W]'},
  ]},
  {sec:'RELAY PROTECTION & MEASUREMENT',items:[
    {k:'relay_alarm',label:'No Alarm active'},
    {k:'active_power',label:'Active Power',hasValue:true,unit:'kW'},
    {k:'reactive_power',label:'Reactive Power',hasValue:true,unit:'kVAR'},
  ]},
  {sec:'WINDING TEMPERATURE (°C)',items:[
    {k:'wt_l1',label:'L1 — Actual / Max.',hasValue:true,unit:'°C',sub:'Alarm=100°C, Trip=110°C'},
    {k:'wt_l2',label:'L2 — Actual / Max.',hasValue:true,unit:'°C'},
    {k:'wt_l3',label:'L3 — Actual / Max.',hasValue:true,unit:'°C'},

];

const PROT_ITEMS=[
  {k:'wt_l1_alarm',label:'Winding Temp. L1 [Alarm]',ref:'X2:10-27',irKey:'ir_wt_l1a'},
  {k:'wt_l2_alarm',label:'Winding Temp. L2 [Alarm]',ref:'X2:11-28',irKey:'ir_wt_l2a'},

  {k:'wt_l2_trip',label:'Winding Temp. L2 [Trip]',ref:'X2:2-19',irKey:'ir_wt_l2t'},
  {k:'wt_l3_trip',label:'Winding Temp. L3 [Trip]',ref:'X2:3-20',irKey:'ir_wt_l3t'},
  {k:'oil_lv_min',label:'Oil Level Min [Alarm]',ref:'X2:15-32',irKey:'ir_oil_min'},
  {k:'oil_lv_max',label:'Oil Level Max [Alarm]',ref:'X2:16-33',irKey:'ir_oil_max'},
  {k:'oil_tmp_alm',label:'Oil Temperature [Alarm]',ref:'X2:13-30',irKey:'ir_oil_ta'},
  {k:'oil_tmp_trp',label:'Oil Temperature [Trip]',ref:'X2:4-21',irKey:'ir_oil_tt'},
  {k:'pr1_trip',label:'Pressure Relief 1 [Trip]',ref:'X2:5-22',irKey:'ir_pr1t'},
  {k:'pr1_nu',label:'Pressure Relief 1 [Not Use]',ref:'X2:6-23',irKey:'ir_pr1nu'},
  {k:'buch1_trip',label:'Buchholz Relay 1 [Trip]',ref:'X2:7-24',irKey:'ir_buch1t'},

function updateCkBtn(k,v){
  const row=document.querySelector(`[data-ck="${k}"]`);
  if(!row)return;
  row.querySelectorAll('.cb').forEach(b=>{b.className='cb';});
  const active=row.querySelector(`[data-val="${v}"]`);
  if(active)active.className='cb '+(v==='ok'?'ok':v==='ng'?'ng':'na');
}
function updateProtBtn(k,col,v){
  const cell=document.querySelector(`[data-prot="${k}"][data-col="${col}"]`);
  if(!cell)return;
  cell.querySelectorAll('.cb').forEach(b=>b.className='cb');
  const active=cell.querySelector(`[data-val="${v}"]`);
  if(active)active.className='cb '+(v==='ok'?'ok':'ng');
}

let CK_RESULT='Accepted';
let CK_EDIT_ID=null;
function onTagSelect(tag){
  if(!tag)return;
  const recs=S.rec.filter(r=>r.tag===tag).sort((a,b)=>b.date.localeCompare(a.date));
  if(!recs.length)return;
  const r=recs[0];
  if(!confirm('พบ PM Record ล่าสุดของ '+tag+' ('+r.date+')\nต้องการโหลดข้อมูลมาแสดงไหม?'))return;
  populateCkFromRecord(r,false);
}
function populateCkFromRecord(r,editMode){
  CK_EDIT_ID=editMode?r.id:null;
  if(E('ck-date'))E('ck-date').value=r.date||'';
  if(E('ck-wo'))E('ck-wo').value=r.wo||'';
  if(E('ck-insp'))E('ck-insp').value=r.insp||'';
  if(E('ck-rev'))E('ck-rev').value=r.rev||'';
  if(E('ck-remark'))E('ck-remark').value=r.remark||'';
  if(E('ck-tag'))E('ck-tag').value=r.tag||'';
  CK.gen={...r.gen||{}};CK.values={...r.genValues||{}};
  CK.remarks={...r.genRemarks||{}};CK.prot={...r.prot||{}};CK.ir={...r.ir||{}};
  CK_RESULT=r.result||'Accepted';
  setTimeout(()=>{
    Object.entries(CK.gen).forEach(([k,v])=>updateCkBtn(k,v));
    Object.entries(CK.prot).forEach(([k,cols])=>{if(typeof cols==='object')Object.entries(cols).forEach(([col,v])=>updateProtBtn(k,col,v));});
    setResult(CK_RESULT);
    Object.entries(CK.values).forEach(([k,v])=>{const row=document.querySelector('[data-ck="'+k+'"]');if(row){const inp=row.querySelector('input.vi');if(inp)inp.value=v||'';}});
    Object.entries(CK.remarks).forEach(([k,v])=>{const row=document.querySelector('[data-ck="'+k+'"]');if(row){const rem=row.querySelector('input.fi[placeholder="Remark..."]');if(rem)rem.value=v||'';}});
    if(editMode){const svb=document.querySelector('.btn-s');if(svb)svb.textContent='✓ อัพเดต PM Record';}
    toast(editMode?'โหลดข้อมูลเพื่อแก้ไข ✓':'โหลดข้อมูลล่าสุดแล้ว');
  },100);
}
function setResult(v){
  CK_RESULT=v;
  E('res-acc').className='cb'+(v==='Accepted'?' ok':'');
  E('res-rej').className='cb'+(v==='Unaccepted'?' ng':'');
}

async function saveRecord(){
  if(!canEdit()){toast('ไม่มีสิทธิ์บันทึก','err');return;}
  const tag=E('ck-tag').value;const date=E('ck-date').value;
  if(!tag||!date){toast('กรุณาเลือก Tag และวันที่','err');return;}
  const rec={
    tag,date,wo:E('ck-wo').value,insp:E('ck-insp').value,rev:E('ck-rev').value,
    result:CK_RESULT,remark:E('ck-remark')?.value||'',
    gen:{...CK.gen},genValues:{...CK.values},genRemarks:{...CK.remarks},
    prot:{...CK.prot},ir:{...CK.ir},
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
    createdBy:S.usr?.email||''
  };
  try{
    if(CK_EDIT_ID){
      await db.collection('tr_records').doc(CK_EDIT_ID).update({...rec,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
      const idx=S.rec.findIndex(x=>x.id===CK_EDIT_ID);
      if(idx>=0)S.rec[idx]={id:CK_EDIT_ID,...rec};
      CK_EDIT_ID=null;toast('อัพเดต PM '+tag+' สำเร็จ ✓');
    }else{
      const ref=await db.collection('tr_records').add(rec);
      S.rec.unshift({id:ref.id,...rec});toast('บันทึก PM '+tag+' สำเร็จ ✓');
    }
    go('history',E('nav-history'));
  }catch(e){toast('Error: '+e.message,'err');}
}

function showDetail(id){
  const r=S.rec.find(x=>x.id===id);if(!r)return;
  const eq=S.eq.find(e=>e.tag===r.tag);
  let h='';
  h+='<div class="sec-title">📋 PM Information</div>';

  [['Tag',r.tag],['Date',r.date],['WO',r.wo||'—'],['Inspector',r.insp||'—'],['Reviewer',r.rev||'—'],['Result',r.result]].forEach(([l,v])=>{
    h+=`<div style="padding:6px 0;border-bottom:1px solid var(--border)"><div style="font-size:11px;color:var(--text3)">${l}</div><div style="font-weight:500">${v}</div></div>`;
  });
  h+='</div>';
  // General inspection summary
  if(r.gen&&Object.keys(r.gen).length){
    h+='<div class="sec-title">📋 General Inspection</div>';
    GEN_ITEMS.forEach(sec=>{
      sec.items.forEach(item=>{

function addEq(){openEqModal();}
function editEq(tag){const eq=S.eq.find(e=>e.tag===tag);if(eq)openEqModal(eq);}

function openEqModal(eq){
  let mo=E('eq-mo');
  if(!mo){
    mo=document.createElement('div');mo.id='eq-mo';mo.className='mo';
    mo.innerHTML='<div class="modal"><div class="mh"><div style="font-weight:600" id="eq-mo-t">Add Transformer</div><button class="mc-btn" onclick="E(\'eq-mo\').classList.remove(\'show\')">✕</button></div>'+
    '<div class="mb"><div class="g2" style="gap:12px">'+
    '<div class="fg"><label class="fl">Tag *</label><input class="fi" id="eq-tag" placeholder="40BFT20"></div>'+
    '<div class="fg"><label class="fl">Unit</label><input class="fi" id="eq-unit" placeholder="GTG42"></div>'+
    '<div class="fg"><label class="fl">Description</label><input class="fi" id="eq-desc" placeholder="Aux.Service Transformer 42"></div>'+
    '<div class="fg"><label class="fl">Model</label><input class="fi" id="eq-model" placeholder="TIRATHAI LH16"></div>'+
    '<div class="fg"><label class="fl">Rated (kVA)</label><input class="fi" id="eq-rated" placeholder="1250 kVA, Dyn5"></div>'+
    '<div class="fg"><label class="fl">Voltage</label><input class="fi" id="eq-volt" placeholder="6.6kV / 415V [ONAN]"></div>'+
    '<div class="fg"><label class="fl">Location</label><input class="fi" id="eq-loc" placeholder="Building / Bay"></div>'+
    '<div class="fg"><label class="fl">Oil Temp Alarm / Trip (°C)</label><input class="fi" id="eq-ot" placeholder="83 / 88"></div>'+
    '<div class="fg"><label class="fl">Winding Temp Alarm / Trip (°C)</label><input class="fi" id="eq-wt" placeholder="100 / 110"></div>'+
    '</div>'+
    '<button class="btn btn-s" style="margin-top:16px" onclick="saveEq()">✓ Save</button>'+
    '</div></div>';
    document.body.appendChild(mo);
  }
  E('eq-mo-t').textContent=eq?'Edit — '+eq.tag:'Add Transformer';
  ['tag','unit','desc','model','rated','volt','loc','ot','wt'].forEach(f=>{if(E('eq-'+f))E('eq-'+f).value=eq?eq[f]||'':'';});
  if(E('eq-tag'))E('eq-tag').disabled=!!eq;
  mo.classList.add('show');
}

async function saveEq(){
  if(!canEdit()){toast('ไม่มีสิทธิ์','err');return;}
  const tag=E('eq-tag').value.trim();if(!tag){toast('Tag required','err');return;}
  const data={tag,unit:E('eq-unit').value,desc:E('eq-desc').value,model:E('eq-model').value,rated:E('eq-rated').value,volt:E('eq-volt').value,loc:E('eq-loc').value,ot:E('eq-ot').value,wt:E('eq-wt').value};
  try{
    await db.collection('tr_equipment').doc(tag).set(data,{merge:true});
    const idx=S.eq.findIndex(e=>e.tag===tag);if(idx>=0)S.eq[idx]=data;else S.eq.push(data);
    E('eq-mo').classList.remove('show');
    toast('บันทึก '+tag+' แล้ว ✓');
    pgEq(E('content'));
  }catch(e){toast('Error: '+e.message,'err');}
}

async function delEq(tag){
  if(!isAdmin()){toast('เฉพาะ Admin','err');return;}
  if(!confirm('ลบ '+tag+'?'))return;
  try{await db.collection('tr_equipment').doc(tag).delete();S.eq=S.eq.filter(e=>e.tag!==tag);toast('ลบ '+tag+' แล้ว','warn');pgEq(E('content'));}
  catch(e){toast('Error: '+e.message,'err');}
}


// ══════════ IMPORT EXCEL ══════════
function pgImport(el){
  el.innerHTML='';
  const card=document.createElement('div');card.className='card';
  card.innerHTML='<div class="st">📥 Import Excel — Transformer Inspection Report</div>'+
    '<div style="font-size:13px;color:var(--text3);margin-bottom:16px">รองรับ format: AST Transformer Report (มี 2 Sheet)</div>';
  // Drop zone
  const dz=document.createElement('div');
  dz.style.cssText='border:2px dashed var(--border2);border-radius:var(--r);padding:40px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:16px';
  dz.innerHTML='<div style="font-size:36px;margin-bottom:8px">📂</div>'+
    '<div style="font-size:14px;font-weight:500;margin-bottom:4px">ลากไฟล์วางที่นี่ หรือคลิกเลือก</div>'+
    '<div style="font-size:12px;color:var(--text3)">.xlsx | เลือกหลายไฟล์ได้</div>';
  const fi=document.createElement('input');fi.type='file';fi.accept='.xlsx';fi.multiple=true;fi.style.display='none';
  dz.onclick=()=>fi.click();
  dz.ondragover=(e)=>{e.preventDefault();dz.style.borderColor='var(--amber)';};
  dz.ondragleave=()=>dz.style.borderColor='';
  dz.ondrop=(e)=>{e.preventDefault();dz.style.borderColor='';processTrFiles(e.dataTransfer.files,res);};
  fi.onchange=()=>processTrFiles(fi.files,res);
  card.appendChild(dz);card.appendChild(fi);
  const res=document.createElement('div');res.id='import-result';
  card.appendChild(res);
  el.appendChild(card);
}

async function processTrFiles(files,resultBox){
  if(!files.length)return;
  resultBox.innerHTML='<div style="color:var(--text3);font-size:13px;padding:8px">⏳ กำลัง import '+files.length+' ไฟล์...</div>';
  let ok=0,skip=0,err=0;const log=[];
  for(const file of files){
    try{
      const result=await importTrXlsx(file);
      if(result.status==='ok'){ok++;log.push({file:file.name,status:'ok',msg:result.tag+' — '+result.date});}
      else if(result.status==='skip'){skip++;log.push({file:file.name,status:'skip',msg:result.msg});}
    }catch(e){err++;log.push({file:file.name,status:'err',msg:e.message});}
  }
  await loadAll();
  resultBox.innerHTML='<div style="font-size:13px;font-weight:600;margin-bottom:12px">ผลการ Import: ✅ '+ok+' | ⏭ '+skip+' | ❌ '+err+'</div>';
  const tbl=document.createElement('table');tbl.className='cht';
  tbl.innerHTML='<thead><tr><th>ไฟล์</th><th>สถานะ</th><th>รายละเอียด</th></tr></thead>';
  const tb=document.createElement('tbody');
  log.forEach(l=>{
    const tr=document.createElement('tr');
    tr.innerHTML='<td style="font-size:12px">'+l.file+'</td>'+
      '<td><span class="badge '+(l.status==='ok'?'b-ok':l.status==='skip'?'b-al':'b-ng')+'">'+(l.status==='ok'?'✅ OK':l.status==='skip'?'⏭ Skip':'❌ Error')+'</span></td>'+
      '<td style="font-size:12px;color:var(--text3)">'+l.msg+'</td>';
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);resultBox.appendChild(tbl);
}

async function importTrXlsx(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=async(e)=>{
      try{
        const data=new Uint8Array(e.target.result);
        const wb=XLSX.read(data,{type:'array',cellDates:false});
        // Find Sheet 1 (General Inspection)
        const ws1=wb.Sheets[wb.SheetNames[0]];
        const ws2=wb.Sheets.length>1?wb.Sheets[wb.SheetNames[1]]:null;
        const g1=(addr)=>{const c=ws1[addr];return c?String(c.v||'').trim():'';};
        const g2=(addr)=>{if(!ws2)return'';const c=ws2[addr];return c?String(c.v||'').trim():'';};
        const boolVal=(v)=>v==='True'?'ok':v==='False'?'ng':'na';
        // Equipment info
        const tag=g1('E5');if(!tag)return resolve({status:'skip',msg:'ไม่พบ Equipment code (E5)'});
        // Date
        const dv=ws1['E66']?.v;
        let date='';
        if(typeof dv==='number'){
          const d=new Date(Math.round((dv-25569)*86400*1000));
          date=d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
        }else if(dv instanceof Date){
          date=dv.getUTCFullYear()+'-'+String(dv.getUTCMonth()+1).padStart(2,'0')+'-'+String(dv.getUTCDate()).padStart(2,'0');
        }else if(typeof dv==='string'){
          const m=dv.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)date=m[0];
        }
        if(!date)return resolve({status:'skip',msg:'ไม่พบวันที่ (E66)'});
        // Check duplicate
        if(S.rec.find(r=>r.tag===tag&&r.date===date))
          return resolve({status:'skip',msg:'ซ้ำ: '+tag+' '+date});
        // Auto-create equipment if not exists
        if(!S.eq.find(e=>e.tag===tag)){
          const eqData={
            tag,unit:g1('J5'),desc:g1('E6'),
            model:g1('E9'),rated:g1('E10'),volt:g1('E11'),
            ot:'83 / 88',wt:'100 / 110',loc:''
          };
          await db.collection('tr_equipment').doc(tag).set(eqData,{merge:true});
        }
        // Sheet 1 — General Inspection
        const gen={
          oil_leak:boolVal(g1('G16')),
          terminal:boolVal(g1('G17')),
          tighten:boolVal(g1('G18')),
          tap_chg:g1('G19')?'ok':'na',
          sound:boolVal(g1('G20')),
          heater_tank:boolVal(g1('G21')),
          silica:boolVal(g1('G24')),
          oil_seal:boolVal(g1('G26')),
          breathing:boolVal(g1('G27')),
          oil_level:boolVal(g1('G29')),
          oil_temp:boolVal(g1('G30')),
          valve_open:boolVal(g1('G33')),
          buchholz_leak:boolVal(g1('G34')),
          no_gas:boolVal(g1('G35')),
          pr_blowout:boolVal(g1('G37')),
          pr_leak:boolVal(g1('G38')),
          rpr_leak:boolVal(g1('G40')),
          led_ok:boolVal(g1('G42')),
          no_alarm:boolVal(g1('G43')),
          heater_panel:boolVal(g1('G44')),
          relay_alarm:boolVal(g1('G46')),
          active_power:g1('G47')?'ok':'na',
          reactive_power:g1('G48')?'ok':'na',
          wt_l1:'ok',wt_l2:'ok',wt_l3:'ok',
        };
        // Values + Remarks
        const genValues={
          oil_level:g1('K29'),oil_temp:g1('K30'),
          wt_l1:g1('C51'),wt_l2:g1('E51'),wt_l3:g1('G51'),
          active_power:g1('G47'),reactive_power:g1('G48'),tap_chg:g1('G19'),
        };
        const genRemarks={
          terminal:g1('K17'),tighten:g1('K18'),tap_chg:g1('K19'),
          heater_tank:g1('K21'),silica:g1('K24'),oil_level:g1('K29'),
          oil_temp:g1('K30'),heater_panel:g1('K44'),
          wt_l1:g1('K51')+'/'+(g1('E51')||'')+'/'+(g1('G51')||''),
        };
        // Sheet 2 — Protection Simulation
        const prot={};
        const protRows={
          wt_l1_alarm:{f:16},wt_l2_alarm:{f:17},wt_l3_alarm:{f:18},
          wt_l1_trip:{f:19},wt_l2_trip:{f:20},wt_l3_trip:{f:21},
          oil_lv_min:{f:22},oil_lv_max:{f:23},oil_tmp_alm:{f:24},
          oil_tmp_trp:{f:25},pr1_trip:{f:26},pr1_nu:{f:27},
          buch1_trip:{f:28},buch2_nu:{f:29},buch_alm:{f:30},
          rpr_trip:{f:31},rubber_alm:{f:32}
        };
        const irValues={};
        Object.entries(protRows).forEach(([key,{f}])=>{
          prot[key]={
            led:boolVal(g2('F'+f)),
            lor:boolVal(g2('H'+f)),
            dcs:boolVal(g2('J'+f))
          };
          const irKey='ir_'+key.replace(/_/g,'');
          irValues[irKey]=g2('K'+f);
        });
        // Inspector / Reviewer / Result
        const insp=g1('C64').replace('Inspect person :','').trim()||'';
        const rev=g1('H64').replace('Review person:','').trim()||'';
        const result=g1('F59')==='True'?'Accepted':'Unaccepted';
        // Build record
        const rec={tag,date,insp,rev,result,remark:'',
          gen,genValues,genRemarks,prot,ir:irValues,
          importedFrom:file.name,
          createdAt:firebase.firestore.FieldValue.serverTimestamp()
        };
        await db.collection('tr_records').add(rec);
        resolve({status:'ok',tag,date});
      }catch(ex){reject(ex);}
    };
    reader.onerror=()=>reject(new Error('อ่านไฟล์ไม่ได้'));
    reader.readAsArrayBuffer(file);
  });
}
